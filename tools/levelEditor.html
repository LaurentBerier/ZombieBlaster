<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Generic Level Editor</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; font-family: system-ui, sans-serif; background: #1a1a1f; color: #e8e8ec; }
    #layout { display: grid; grid-template-columns: 1fr 300px; grid-template-rows: 1fr auto; height: 100%; }
    #viewport { grid-column: 1; grid-row: 1; position: relative; min-height: 200px; }
    #viewport canvas { display: block; width: 100%; height: 100%; }
    #sidebar { grid-column: 2; grid-row: 1 / 3; border-left: 1px solid #333; padding: 12px; overflow-y: auto; }
    #toolbar { grid-column: 1; grid-row: 2; border-top: 1px solid #333; padding: 8px 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    #toolbar button { padding: 6px 14px; cursor: pointer; background: #2d6cdf; color: #fff; border: none; border-radius: 4px; }
    #toolbar button:hover { background: #4580e8; }
    #toolbar button.secondary { background: #444; }
    #toolbar .hint { font-size: 12px; color: #888; margin-left: 8px; }
    #layers { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
    #layers label { font-size: 13px; cursor: pointer; user-select: none; }
    #status { font-size: 12px; color: #7ab; min-width: 120px; }
    #props h3 { margin: 0 0 10px; font-size: 14px; font-weight: 600; }
    .prop-row { margin-bottom: 8px; }
    .prop-row label { display: block; font-size: 11px; color: #9aa; margin-bottom: 2px; }
    .prop-row input[type="text"], .prop-row input[type="number"] { width: 100%; padding: 4px 6px; border: 1px solid #444; border-radius: 3px; background: #25252c; color: #eee; }
    .prop-row input[readonly] { opacity: 0.7; }
    #dataNote { font-size: 11px; color: #666; margin-top: 12px; line-height: 1.4; }
  </style>
</head>
<body>
  <div id="layout">
    <div id="viewport"></div>
    <aside id="sidebar">
      <div id="props">
        <h3>Properties</h3>
        <p id="propsEmpty">Select an object in the viewport.</p>
        <div id="propsForm" style="display:none"></div>
      </div>
      <p id="dataNote">Load URL: <code>?data=../data/levelData.json</code>. Save always writes <code>data/levelData.json</code> on the server.</p>
    </aside>
    <div id="toolbar">
      <button type="button" id="btnSave">Save</button>
      <button type="button" id="btnReload" class="secondary">Reload</button>
      <span id="status"></span>
      <span class="hint">Left-drag object to move on XZ · Shift+drag for Y (if item has y) · Left-drag empty space orbits · Right-drag pans · Wheel zooms</span>
      <div id="layers"></div>
    </div>
  </div>

  <script src="../js/lib/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.129.0/examples/js/controls/OrbitControls.js"></script>
  <script>
(function () {
  'use strict';

  const params = new URLSearchParams(location.search);
  const dataUrl = params.get('data') || '../data/levelData.json';

  let levelData = null;
  let scene, camera, renderer, controls;
  let levelRoot;
  const pickList = [];
  let selectedMesh = null;
  let drag = null;
  const raycaster = new THREE.Raycaster();
  const ndc = new THREE.Vector2();
  const plane = new THREE.Plane();
  const planeHit = new THREE.Vector3();

  function setStatus(msg, isErr) {
    const el = document.getElementById('status');
    el.textContent = msg || '';
    el.style.color = isErr ? '#f88' : '#7ab';
  }

  function discoverLayers(obj, prefix, out) {
    if (!obj || typeof obj !== 'object' || Array.isArray(obj)) return;
    for (const key of Object.keys(obj)) {
      const p = prefix ? prefix + '.' + key : key;
      const v = obj[key];
      if (Array.isArray(v)) {
        const ok = v.every(function (x) { return x && typeof x === 'object' && !Array.isArray(x); });
        if (ok) out.push({ path: p, items: v });
      } else if (v && typeof v === 'object' && !Array.isArray(v)) {
        discoverLayers(v, p, out);
      }
    }
  }

  function parseColorField(val, fallbackHex) {
    if (typeof val === 'string' && /^0x[0-9a-f]+$/i.test(val.trim())) return parseInt(val.trim(), 16);
    if (typeof val === 'number' && !isNaN(val)) return val;
    return fallbackHex;
  }

  function layerColor(path, sampleItem) {
    if (sampleItem && sampleItem.color != null) return parseColorField(sampleItem.color, 0x888888);
    var h = 0;
    for (var i = 0; i < path.length; i++) h = ((h * 31 + path.charCodeAt(i)) | 0);
    var c = new THREE.Color();
    c.setHSL((Math.abs(h) % 360) / 360, 0.55, 0.52);
    return c.getHex();
  }

  function classifyItem(item) {
    if (typeof item.intensity === 'number' && typeof item.distance === 'number') return 'lightsphere';
    if (item.direction != null && typeof item.direction === 'string') return 'cone';
    if (typeof item.radius === 'number') return 'disc';
    if (typeof item.w === 'number' && typeof item.h === 'number' && typeof item.d === 'number') return 'box_whd';
    if (typeof item.width === 'number' && typeof item.depth === 'number' && typeof item.thickness === 'number') return 'box_wdt';
    if (typeof item.w === 'number' && typeof item.d === 'number') return 'box_wd';
    return 'marker';
  }

  function getWorldCenter(item) {
    if (item.cx != null && item.cz != null) {
      var hy = item.h != null ? item.h * 0.5 : 0;
      return new THREE.Vector3(item.cx, hy, item.cz);
    }
    if (item.axis === 'x' && item.pos != null) {
      var hh = item.h != null ? item.h * 0.5 : 0;
      return new THREE.Vector3(item.pos, hh, 0);
    }
    if (item.axis === 'z' && item.pos != null) {
      var hh2 = item.h != null ? item.h * 0.5 : 0;
      return new THREE.Vector3(0, hh2, item.pos);
    }
    if (item.x != null && item.z != null) {
      return new THREE.Vector3(item.x, item.y != null ? item.y : 0, item.z);
    }
    return new THREE.Vector3(0, 0, 0);
  }

  function applyXZToItem(item, wx, wz) {
    if (item.cx != null && item.cz != null) {
      item.cx = wx;
      item.cz = wz;
      return;
    }
    if (item.axis === 'x') {
      item.pos = wx;
      return;
    }
    if (item.axis === 'z') {
      item.pos = wz;
      return;
    }
    item.x = wx;
    item.z = wz;
  }

  function hasYField(item) {
    return Object.prototype.hasOwnProperty.call(item, 'y') && typeof item.y === 'number';
  }

  function disposeMesh(mesh) {
    if (!mesh) return;
    mesh.traverse(function (o) {
      if (o.geometry) o.geometry.dispose();
      if (o.material) {
        if (Array.isArray(o.material)) o.material.forEach(function (m) { m.dispose(); });
        else o.material.dispose();
      }
    });
  }

  function makeMaterial(hex, isSelected) {
    var m = new THREE.MeshStandardMaterial({
      color: hex,
      metalness: 0.2,
      roughness: 0.75,
      transparent: true,
      opacity: 0.92
    });
    if (isSelected) m.emissive = new THREE.Color(0x444444);
    return m;
  }

  function buildMesh(item, layerPath, index) {
    var kind = classifyItem(item);
    var baseHex = layerColor(layerPath, item);
    var mat = makeMaterial(baseHex, false);
    var mesh;
    var geo;

    switch (kind) {
      case 'box_whd':
        geo = new THREE.BoxGeometry(item.w, item.h, item.d);
        mesh = new THREE.Mesh(geo, mat);
        break;
      case 'box_wdt':
        geo = new THREE.BoxGeometry(item.width, item.thickness, item.depth);
        mesh = new THREE.Mesh(geo, mat);
        break;
      case 'box_wd':
        geo = new THREE.BoxGeometry(item.w, 0.25, item.d);
        mesh = new THREE.Mesh(geo, mat);
        break;
      case 'disc':
        geo = new THREE.CylinderGeometry(item.radius, item.radius, 0.2, 28);
        mesh = new THREE.Mesh(geo, mat);
        break;
      case 'lightsphere': {
        var r = Math.min(Math.max((item.distance || 10) * 0.12, 0.35), 2.5);
        geo = new THREE.SphereGeometry(r, 16, 12);
        mesh = new THREE.Mesh(geo, mat);
        break;
      }
      case 'cone':
        geo = new THREE.ConeGeometry(0.45, 1.4, 10);
        mesh = new THREE.Mesh(geo, mat);
        if (item.direction === 'x') mesh.rotation.z = -Math.PI / 2;
        else if (item.direction === 'z') mesh.rotation.x = Math.PI / 2;
        break;
      default:
        geo = new THREE.BoxGeometry(0.6, 0.6, 0.6);
        mesh = new THREE.Mesh(geo, mat);
    }

    mesh.userData.layerPath = layerPath;
    mesh.userData.index = index;
    mesh.userData.itemRef = item;
    mesh.userData.shapeKind = kind;
    mesh.userData.baseColor = baseHex;
    syncMeshTransform(mesh);
    return mesh;
  }

  function geometrySignature(item, kind) {
    if (kind === 'lightsphere') return 'L:' + (item.distance || 0);
    if (kind === 'disc') return 'D:' + (item.radius || 0);
    if (kind === 'box_whd') return 'W:' + [item.w, item.h, item.d].join(',');
    if (kind === 'box_wdt') return 'T:' + [item.width, item.thickness, item.depth].join(',');
    if (kind === 'box_wd') return 'P:' + [item.w, item.d].join(',');
    if (kind === 'cone') return 'C:' + item.direction;
    return kind;
  }

  function syncMeshTransform(mesh) {
    var item = mesh.userData.itemRef;
    var kind = mesh.userData.shapeKind;
    var c = getWorldCenter(item);
    if (kind === 'disc') {
      mesh.position.set(item.x != null ? item.x : 0, 0.1, item.z != null ? item.z : 0);
    } else if (kind === 'cone') {
      mesh.position.set(item.x != null ? item.x : 0, item.y != null ? item.y : 0.7, item.z != null ? item.z : 0);
    } else if (kind === 'lightsphere') {
      mesh.position.set(item.x != null ? item.x : 0, item.y != null ? item.y : 2, item.z != null ? item.z : 0);
    } else {
      mesh.position.copy(c);
    }

    var sig = geometrySignature(item, kind);
    if (mesh.userData._geomSig === sig) {
      mesh.updateMatrixWorld(true);
      return;
    }
    mesh.userData._geomSig = sig;
    if (mesh.geometry) mesh.geometry.dispose();

    if (kind === 'lightsphere') {
      var r = Math.min(Math.max((item.distance || 10) * 0.12, 0.35), 2.5);
      mesh.geometry = new THREE.SphereGeometry(r, 16, 12);
    } else if (kind === 'disc') {
      mesh.geometry = new THREE.CylinderGeometry(item.radius, item.radius, 0.2, 28);
    } else if (kind === 'box_whd') {
      mesh.geometry = new THREE.BoxGeometry(item.w, item.h, item.d);
    } else if (kind === 'box_wdt') {
      mesh.geometry = new THREE.BoxGeometry(item.width, item.thickness, item.depth);
    } else if (kind === 'box_wd') {
      mesh.geometry = new THREE.BoxGeometry(item.w, 0.25, item.d);
    } else if (kind === 'cone') {
      mesh.geometry = new THREE.ConeGeometry(0.45, 1.4, 10);
      if (item.direction === 'x') mesh.rotation.set(0, 0, -Math.PI / 2);
      else if (item.direction === 'z') mesh.rotation.set(Math.PI / 2, 0, 0);
      else mesh.rotation.set(0, 0, 0);
    } else {
      mesh.geometry = new THREE.BoxGeometry(0.6, 0.6, 0.6);
    }
    mesh.updateMatrixWorld(true);
  }

  function setSelected(mesh) {
    if (selectedMesh && selectedMesh.material) {
      selectedMesh.material.emissive = new THREE.Color(0x000000);
    }
    selectedMesh = mesh;
    if (selectedMesh && selectedMesh.material) {
      selectedMesh.material.emissive = new THREE.Color(0x333355);
    }
    renderProps();
  }

  function renderProps() {
    var empty = document.getElementById('propsEmpty');
    var form = document.getElementById('propsForm');
    empty.style.display = selectedMesh ? 'none' : 'block';
    form.style.display = selectedMesh ? 'block' : 'none';
    form.innerHTML = '';
    if (!selectedMesh) return;

    var item = selectedMesh.userData.itemRef;
    var path = selectedMesh.userData.layerPath;
    var typeEl = document.createElement('div');
    typeEl.className = 'prop-row';
    typeEl.innerHTML = '<label>type</label><input type="text" readonly value="' + escapeAttr(path) + '" />';
    form.appendChild(typeEl);

    var keys = Object.keys(item).sort();
    for (var i = 0; i < keys.length; i++) {
      var key = keys[i];
      var val = item[key];
      if (val !== null && typeof val === 'object' && !Array.isArray(val)) continue;

      var row = document.createElement('div');
      row.className = 'prop-row';
      var lab = document.createElement('label');
      lab.textContent = key;
      row.appendChild(lab);

      if (key === 'id') {
        var inp = document.createElement('input');
        inp.type = 'text';
        inp.readOnly = true;
        inp.value = String(val);
        row.appendChild(inp);
      } else if (typeof val === 'number') {
        var num = document.createElement('input');
        num.type = 'number';
        num.step = 'any';
        num.value = String(val);
        num.dataset.key = key;
        num.addEventListener('input', onPropNumberInput);
        row.appendChild(num);
      } else if (typeof val === 'boolean') {
        var cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = val;
        cb.dataset.key = key;
        cb.addEventListener('change', onPropBoolChange);
        row.appendChild(cb);
      } else {
        var t = document.createElement('input');
        t.type = 'text';
        t.value = val == null ? '' : String(val);
        t.dataset.key = key;
        t.addEventListener('input', onPropTextInput);
        row.appendChild(t);
      }
      form.appendChild(row);
    }
  }

  function escapeAttr(s) {
    return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  }

  function onPropNumberInput(ev) {
    if (!selectedMesh) return;
    var key = ev.target.dataset.key;
    var v = parseFloat(ev.target.value);
    if (isNaN(v)) return;
    selectedMesh.userData.itemRef[key] = v;
    syncMeshTransform(selectedMesh);
    if (key === 'color' || key === 'intensity') { /* color might be number */ }
    if (selectedMesh.userData.shapeKind === 'lightsphere' && (key === 'color' || key === 'distance')) {
      var item = selectedMesh.userData.itemRef;
      var hex = layerColor(selectedMesh.userData.layerPath, item);
      selectedMesh.material.color.setHex(hex);
      selectedMesh.userData.baseColor = hex;
    }
  }

  function onPropBoolChange(ev) {
    if (!selectedMesh) return;
    selectedMesh.userData.itemRef[ev.target.dataset.key] = ev.target.checked;
  }

  function onPropTextInput(ev) {
    if (!selectedMesh) return;
    var key = ev.target.dataset.key;
    var raw = ev.target.value;
    selectedMesh.userData.itemRef[key] = raw;
    if (key === 'color') {
      var hex = parseColorField(raw, selectedMesh.userData.baseColor);
      selectedMesh.material.color.setHex(hex);
    }
    if (key === 'direction' && selectedMesh.userData.shapeKind === 'cone') {
      selectedMesh.userData._geomSig = null;
      syncMeshTransform(selectedMesh);
    }
  }

  function clearScene() {
    pickList.length = 0;
    setSelected(null);
    if (levelRoot) {
      levelRoot.traverse(function (o) {
        if (o.isMesh) disposeMesh(o);
      });
      scene.remove(levelRoot);
      levelRoot = null;
    }
  }

  function buildSceneFromData(data) {
    clearScene();
    levelRoot = new THREE.Group();
    scene.add(levelRoot);

    var layers = [];
    discoverLayers(data, '', layers);

    var layersHost = document.getElementById('layers');
    layersHost.innerHTML = '<span style="font-size:12px;color:#888">Layers:</span>';

    for (var li = 0; li < layers.length; li++) {
      var L = layers[li];
      var g = new THREE.Group();
      g.name = L.path;
      levelRoot.add(g);

      var id = 'layer_' + li;
      var wrap = document.createElement('label');
      var cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = true;
      cb.id = id;
      cb.addEventListener('change', function (grp, box) {
        return function () { grp.visible = box.checked; };
      }(g, cb));
      wrap.appendChild(cb);
      var sp = document.createElement('span');
      sp.textContent = L.path;
      wrap.appendChild(sp);
      layersHost.appendChild(wrap);

      for (var ii = 0; ii < L.items.length; ii++) {
        var mesh = buildMesh(L.items[ii], L.path, ii);
        g.add(mesh);
        pickList.push(mesh);
      }
    }
    setStatus('Loaded ' + layers.length + ' layer(s).');
  }

  function initThree() {
    var container = document.getElementById('viewport');
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a22);

    camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 2000);
    camera.position.set(0, 95, 72);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);

    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.minDistance = 8;
    controls.maxDistance = 500;
    controls.maxPolarAngle = Math.PI * 0.49;

    scene.add(new THREE.AmbientLight(0x9090a0, 0.85));
    var dir = new THREE.DirectionalLight(0xffffff, 0.35);
    dir.position.set(20, 80, 40);
    scene.add(dir);

    var grid = new THREE.GridHelper(200, 40, 0x444466, 0x2a2a35);
    scene.add(grid);

    window.addEventListener('resize', onResize);
    renderer.domElement.addEventListener('pointerdown', onPointerDown, true);
    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);
    window.addEventListener('pointercancel', onPointerUp);
  }

  function onResize() {
    var container = document.getElementById('viewport');
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
  }

  function pickMesh(clientX, clientY) {
    var rect = renderer.domElement.getBoundingClientRect();
    ndc.x = ((clientX - rect.left) / rect.width) * 2 - 1;
    ndc.y = -((clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(ndc, camera);
    var hits = raycaster.intersectObjects(pickList, false);
    return hits.length ? hits[0].object : null;
  }

  function onPointerDown(ev) {
    if (ev.button !== 0) return;
    var m = pickMesh(ev.clientX, ev.clientY);
    if (m && m.userData.itemRef) {
      ev.stopPropagation();
      controls.enabled = false;
      ev.preventDefault();
      setSelected(m);
      var item = m.userData.itemRef;
      var yPlane = m.position.y;
      plane.setFromNormalAndCoplanarPoint(new THREE.Vector3(0, 1, 0), new THREE.Vector3(0, yPlane, 0));
      drag = {
        mesh: m,
        item: item,
        planeY: yPlane,
        lastX: ev.clientX,
        lastY: ev.clientY
      };
    } else {
      setSelected(null);
    }
  }

  function onPointerMove(ev) {
    if (!drag) return;
    var item = drag.item;
    if (ev.shiftKey && hasYField(item)) {
      var dy = (ev.clientY - drag.lastY) * -0.08;
      item.y += dy;
      drag.lastX = ev.clientX;
      drag.lastY = ev.clientY;
      syncMeshTransform(drag.mesh);
      renderProps();
      return;
    }
    raycaster.setFromCamera(ndcFromEvent(ev), camera);
    if (raycaster.ray.intersectPlane(plane, planeHit)) {
      applyXZToItem(item, planeHit.x, planeHit.z);
      syncMeshTransform(drag.mesh);
      renderProps();
    }
    drag.lastX = ev.clientX;
    drag.lastY = ev.clientY;
  }

  function ndcFromEvent(ev) {
    var rect = renderer.domElement.getBoundingClientRect();
    ndc.x = ((ev.clientX - rect.left) / rect.width) * 2 - 1;
    ndc.y = -((ev.clientY - rect.top) / rect.height) * 2 + 1;
    return ndc;
  }

  function onPointerUp() {
    if (drag) {
      controls.enabled = true;
      drag = null;
    }
  }

  function tick() {
    requestAnimationFrame(tick);
    controls.update();
    renderer.render(scene, camera);
  }

  async function loadLevel() {
    setStatus('Loading…');
    try {
      var res = await fetch(dataUrl, { cache: 'no-store' });
      if (!res.ok) throw new Error(res.status + ' ' + res.statusText);
      levelData = await res.json();
      buildSceneFromData(levelData);
    } catch (e) {
      setStatus('Load failed: ' + e.message, true);
      console.error(e);
    }
  }

  async function saveLevel() {
    if (!levelData) {
      setStatus('Nothing to save.', true);
      return;
    }
    setStatus('Saving…');
    try {
      var body = JSON.stringify(levelData, null, 2);
      var res = await fetch('/api/save-level', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: body
      });
      if (!res.ok) throw new Error(res.status + ' ' + res.statusText);
      setStatus('Saved.');
    } catch (e) {
      setStatus('Save failed: ' + e.message, true);
      console.error(e);
    }
  }

  document.getElementById('btnSave').addEventListener('click', saveLevel);
  document.getElementById('btnReload').addEventListener('click', loadLevel);

  initThree();
  loadLevel();
  tick();
})();
  </script>
</body>
</html>
